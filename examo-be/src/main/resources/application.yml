spring:
  application:
    name: examo-be

  # 1. Postgresql configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456Ab}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Autoupdate tables based on DTOs
    show-sql: true # Shows SQL in console

  # 2. MongoDb configuration
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/examo}

server:
  port: 8080 # Backend port

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
